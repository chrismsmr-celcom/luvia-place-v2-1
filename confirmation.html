<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation - LuviaPlace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --blue: #155EEF;
            --blue-dark: #0E3FB0;
            --ink: #101828;
            --ink-soft: #475467;
            --line: #E7EAF0;
            --bg: #FFFFFF;
            --bg-soft: #F7F9FC;
            --green: #12805C;
            --font-head: 'Manrope', sans-serif;
            --font-body: 'Inter', sans-serif;
            --radius-lg: 20px;
            --radius-md: 14px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            color: var(--ink);
            background: var(--bg-soft);
            line-height: 1.55;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .wrap { max-width: 700px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }

        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px clamp(16px, 4vw, 40px);
            border-bottom: 1px solid var(--line);
            background: var(--bg);
        }

        .logo-img { height: 34px; width: auto; }

        .btn-primary {
            background: var(--blue);
            color: #fff;
            font-weight: 700;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-primary:hover { background: var(--blue-dark); }

        .confirmation-card {
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 40px 32px;
            margin: 40px 0 20px;
            text-align: center;
        }

        .confirmation-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #E7F6EF;
            color: var(--green);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
        }

        .confirmation-icon svg { width: 36px; height: 36px; }

        .confirmation-card h1 {
            font-family: var(--font-head);
            font-weight: 800;
            font-size: 28px;
            margin-bottom: 6px;
        }

        .confirmation-card .subtitle {
            color: var(--ink-soft);
            font-size: 15px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--line);
            border-top-color: var(--blue);
            border-radius: 50%;
            margin: 40px auto;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-voucher {
            display: inline-block;
            margin-top: 16px;
            padding: 12px 28px;
            background: var(--blue);
            color: #fff;
            border-radius: 10px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-voucher:hover { background: var(--blue-dark); }
    </style>
</head>
<body>

    <header>
        <img class="logo-img" src="https://ukbekfcjfcjcqrpxfpmq.supabase.co/storage/v1/object/public/logo%20luvia/LUVIA%20TRAVEL%20LOGO%20SANS%20BACKGROUND.png" alt="LuviaPlace" />
        <a class="btn-primary" href="index.html">Accueil</a>
    </header>

    <div class="wrap" style="flex:1;">

        <!-- Loading -->
        <div id="loadingState" style="text-align:center;padding:60px 0;">
            <div class="spinner"></div>
            <p style="color:var(--ink-soft);font-size:14px;">Confirmation en cours...</p>
        </div>

        <!-- Confirmation -->
        <div id="confirmationState" style="display:none;">
            <div class="confirmation-card">
                <div class="confirmation-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                        <path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>

                <h1>Réservation confirmée !</h1>
                <p class="subtitle">Un email avec votre bon de confirmation vous a été envoyé.</p>

                <a class="btn-voucher" id="voucherLink" href="#">📄 Voir mon bon de confirmation</a>
            </div>
        </div>

        <!-- Error -->
        <div id="errorState" style="display:none;text-align:center;padding:60px 0;">
            <h2>⚠️ Une erreur est survenue</h2>
            <p id="errorMessage" style="color:var(--ink-soft);font-size:14px;"></p>
            <a class="btn-primary" href="index.html" style="display:inline-block;margin-top:16px;">Retour à l'accueil</a>
        </div>

    </div>

    <script>
        var qp = new URLSearchParams(window.location.search);
        var bookingId = qp.get('bookingId') || qp.get('id') || '';

        document.addEventListener('DOMContentLoaded', function() {
            var loading = document.getElementById('loadingState');
            var confirmation = document.getElementById('confirmationState');
            var error = document.getElementById('errorState');

            if (!bookingId) {
                loading.style.display = 'none';
                error.style.display = 'block';
                document.getElementById('errorMessage').textContent = 'Aucun numéro de réservation.';
                return;
            }

            // Afficher le lien vers le bon
            document.getElementById('voucherLink').href = '/booking/' + encodeURIComponent(bookingId) + '/voucher';

            // Charger les infos de confirmation
            fetch('/booking/' + encodeURIComponent(bookingId))
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    loading.style.display = 'none';
                    if (data.success) {
                        confirmation.style.display = 'block';
                    } else {
                        error.style.display = 'block';
                        document.getElementById('errorMessage').textContent = data.message || 'Réservation non trouvée.';
                    }
                })
                .catch(function() {
                    loading.style.display = 'none';
                    error.style.display = 'block';
                    document.getElementById('errorMessage').textContent = 'Impossible de charger les données.';
                });
        });
    </script>

</body>
</html>
