<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Luvia POS — Gestion d'agence</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pos/styles.css"><link rel="manifest" href="/pos/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/pos/icon.svg"><link rel="apple-touch-icon" href="/pos/icon-192.png"><meta name="theme-color" content="#0f2742">
</head>
<body>
<main id="auth" class="auth">
  <form id="login" class="auth-box">
    <img class="mark" src="/pos/icon.svg" alt="" width="52" height="52"><h1>Luvia POS</h1>
    <p>Connectez-vous à l'espace de votre agence.</p>
    <label>Identifiant de l'agence<input name="organizationSlug" autocomplete="organization" required></label>
    <label>Adresse e-mail<input name="email" type="email" autocomplete="username" required></label>
    <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn primary">Se connecter</button>
    <p id="auth-error" class="error" role="alert"></p>
    <p class="hint">Pas encore d'espace ? <a href="/pos/counter/">Créer mon agence</a></p>
  </form>
</main>
<div id="app" class="app" hidden>
  <nav class="rail" aria-label="Navigation principale">
    <div class="brand"><img src="/pos/icon.svg" alt="" width="32" height="32"><span><b>Luvia</b> POS</span></div>
    <a href="/pos/counter/" class="sell">Nouvelle vente</a>
    <a data-p="dashboard" href="#/dashboard">Tableau de bord</a>
    <a data-p="dossiers" href="#/dossiers">Dossiers</a>
    <a data-p="devis" href="#/devis">Devis</a>
    <a data-p="clients" href="#/clients">Clients</a>
    <a data-p="fournisseurs" href="#/fournisseurs">Fournisseurs</a>
    <div class="who"><b id="org"></b><span id="user"></span><button id="logout" class="link">Se déconnecter</button></div>
  </nav>
  <main class="main"><h1 id="title"></h1><div id="view"></div></main>
  <aside id="panel" class="panel" hidden aria-label="Détail du dossier"></aside>
</div>
<dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script src="/pos/app.js"></script>
</body>
</html>
